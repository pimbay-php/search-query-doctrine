x-build-base: &build-base
  context: .
  dockerfile: docker/Dockerfile

x-service-base: &service-base
  working_dir: /app
  volumes:
    - .:/app
    - /app/vendor

services:
  # ── MariaDB 11 — the only engine here besides SQLite.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: 'root'
      MARIADB_DATABASE: 'search_query'
      MARIADB_USER: 'search_query'
      MARIADB_PASSWORD: 'search_query'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: '3s'
      timeout: '3s'
      retries: 20

  # ── PHP 8.3 + DBAL 3 + ORM 3 ──
  php83-dbal3:
    <<: *service-base
    build:
      <<: *build-base
      args:
        PHP_VERSION: '8.3'
        DBAL_CONSTRAINT: '^3.8'
        ORM_CONSTRAINT: '^3.5'
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SEARCH_QUERY_MYSQL_DSN: 'mysql://search_query:search_query@mariadb:3306/search_query'

  # ── PHP 8.3 + DBAL 4 + ORM 3 ──
  php83-dbal4:
    <<: *service-base
    build:
      <<: *build-base
      args:
        PHP_VERSION: '8.3'
        DBAL_CONSTRAINT: '^4.0'
        ORM_CONSTRAINT: '^3.5'
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SEARCH_QUERY_MYSQL_DSN: 'mysql://search_query:search_query@mariadb:3306/search_query'

  # ── PHP 8.4 + DBAL 3 + ORM 3 ──
  php84-dbal3:
    <<: *service-base
    build:
      <<: *build-base
      args:
        PHP_VERSION: '8.4'
        DBAL_CONSTRAINT: '^3.8'
        ORM_CONSTRAINT: '^3.5'

  # ── PHP 8.4 + DBAL 4 + ORM 3 ──
  php84-dbal4:
    <<: *service-base
    build:
      <<: *build-base
      args:
        PHP_VERSION: '8.4'
        DBAL_CONSTRAINT: '^4.0'
        ORM_CONSTRAINT: '^3.5'

  # ── PHP 8.5 + DBAL 3 + ORM 3 ──
  php85-dbal3:
    <<: *service-base
    build:
      <<: *build-base
      args:
        PHP_VERSION: '8.5'
        DBAL_CONSTRAINT: '^3.8'
        ORM_CONSTRAINT: '^3.5'

  # ── PHP 8.5 + DBAL 4 + ORM 3 ──
  php85-dbal4:
    <<: *service-base
    build:
      <<: *build-base
      args:
        PHP_VERSION: '8.5'
        DBAL_CONSTRAINT: '^4.0'
        ORM_CONSTRAINT: '^3.5'